<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal - Linux Command Trainer</title>
  <meta name="description" content="A realistic in-browser Linux terminal simulator with a virtual filesystem, pipes, tab completion and practice challenges.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="section" style="padding-top:34px">
      <div class="section-head">
        <div>
          <h1>Terminal simulator</h1>
          <p class="muted">A safe sandbox with a real virtual filesystem - pipes, redirection, tab completion and 50+ commands. Break anything; the reset button forgives all.</p>
        </div>
        <button class="btn danger small" id="reset-term">Reset sandbox</button>
      </div>
      <div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start">
        <div class="terminal raised">
          <div class="terminal-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">student@trainer:~</span></div>
          <div class="terminal-body tall" id="terminal"></div>
        </div>
        <aside>
          <div class="card">
            <h3>Practice challenges</h3>
            <p class="muted" style="font-size:.88rem">Solve each task by typing real commands. Verification checks the actual sandbox state.</p>
            <div id="challenge-list"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <script type="module" src="js/simulator.js"></script>
</body>
</html>
