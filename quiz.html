<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz - Linux Command Trainer</title>
  <meta name="description" content="Test your Linux knowledge: multiple choice, fill-in-the-blank, true/false and timed quizzes with explanations.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="section" style="padding-top:34px">
      <div id="quiz-setup">
        <h1>Quiz yourself</h1>
        <p class="muted">Questions are generated from the full command database - explanations included.</p>
        <div class="card raised" style="max-width:640px">
          <label class="muted" for="quiz-cat">Category</label>
          <select class="input" id="quiz-cat" style="margin:6px 0 14px"><option value="">All categories</option></select>
          <label class="muted" for="quiz-diff">Difficulty</label>
          <select class="input" id="quiz-diff" style="margin:6px 0 14px">
            <option value="">Mixed</option>
            <option value="beginner">Easy</option>
            <option value="intermediate">Medium</option>
            <option value="advanced">Hard</option>
            <option value="expert">Expert (timed, all types)</option>
          </select>
          <label class="muted" for="quiz-len">Questions</label>
          <select class="input" id="quiz-len" style="margin:6px 0 14px">
            <option value="5">5 - quick</option>
            <option value="10" selected>10 - standard</option>
            <option value="20">20 - marathon</option>
          </select>
          <label style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
            <input type="checkbox" id="quiz-timed"> <span>Timed mode (20s per question)</span>
          </label>
          <button class="btn primary" id="quiz-start">Start quiz</button>
          <button class="btn" id="flash-start">Flashcards instead</button>
        </div>
      </div>
      <div id="quiz-run" hidden>
        <div class="section-head"><h2 id="quiz-counter"></h2><span class="badge amber mono" id="quiz-timer" hidden></span></div>
        <div class="quiz-progress"><div id="quiz-bar" style="width:0%"></div></div>
        <div class="card raised" style="max-width:720px">
          <h3 id="quiz-q"></h3>
          <div id="quiz-code"></div>
          <div id="quiz-options"></div>
          <div id="quiz-explain" class="callout green" hidden></div>
          <button class="btn primary" id="quiz-next" hidden>Next question</button>
        </div>
      </div>
      <div id="quiz-done" hidden></div>
      <div id="flash-view" hidden>
        <div class="section-head"><h2>Flashcards</h2><button class="btn small" id="flash-back">← Quiz setup</button></div>
        <p class="muted">Tap a card to flip it. New random set each visit.</p>
        <div class="grid cols-3" id="flash-grid"></div>
      </div>
    </section>
  </main>
  <script type="module" src="js/quiz.js"></script>
</body>
</html>
